name: quality

on:
  push:
    branches:
      - main
      - fix/runtime-stability
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux runtime packages
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive xargs -a packages.txt apt-get install -y -qq --no-install-recommends

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile entry points
        run: |
          python -m py_compile run.py
          python -m compileall -q app

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate learned motion dataset
        run: python scripts/validate_motion_dataset.py --min-clips 3

      - name: Verify MediaPipe model present
        run: test -f models/pose_landmarker_full.task
